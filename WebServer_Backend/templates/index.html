<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <!-- <link rel="stylesheet" href="../styles/index.css">
    <script src="../scripts/index.js" defer></script> -->
    <link rel="stylesheet"
        href="{{url_for('static', filename='styles/index.css')}}">

    <script defer
         src="{{url_for('static', filename='scripts/index.js')}}">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>

<body>
    <!-- -------- content --------- -->
    <nav class="nb">
        <h1>gtwy light.</h1>        
    </nav>

    <div id="content">
        <div id="display">
            <!-- controls -->
            <div id="side-panel">
                <!-- encender led -->
                <span class="action-container action-card">
                    <h3 class="action-title">Encender LED</h3>
                    <section class="activity-container">
                        <div class="toggle-container">
                            <input type="checkbox" id="toggle-1" class="toggle-input">
                            <label for="toggle-1" class="toggle-label"></label>
                        </div>
                    </section>
                </span>
                <!-- controlar PWM -->
                <span class="action-container action-card">
                    <h3 class="action-title">Controlar PWM</h3>
                    <section class="activity-container">
                        <div class="slider-container">
                            <span style="display: flex; gap: 5px;">
                                <p> valor</p><p id="pwm-slider-label" style="color:rgb(255, 10, 10)">0</p>
                            </span>
                            <input type="range" min="0" max="100" value="0" step="1" id="pwm-slider">
                        </div>
                    </section>
                </span>
                <!-- receptor de boton -->
                <span class="action-container action-card">
                    <h3 class="action-title">boton pin 7</h3>
                    <section class="activity-container">
                        <div id="btn-pin">
                            <div class="square">
                            </div>
                        </div>
                    </section>
                </span>
            </div>

            <!-- chart container -->
            <span class="action-container action-card">
                <section class="activity-container">
                            <!-- chart -->
                            <div class="chart-container" style="width: 400px; height: 300px;">
                                <div class="chart-controls">
                                    <span class="chart-controls-left">
                                            <p>Intervalo <span id="timeValue-1">5</span>(s)</p>
                                            <input type="range" id="slider-1" min="3" max="10" step="1" value=5">
                                    </span>
                                    <span class="chart-controls-right">
                                        <button class="chart-start-btn" id="chart-start-1">▶</button>
                                        <button class="chart-stop-btn" id="chart-stop-1">⏸</button>
                                        <div class="chart-state-dot" id="chart-state-dot-1"> </div>
                                </div>
                                <!-- umbral -->
                                <div>
                                    <span class="umbral-control" id="active-umbral">
                                        <input id="umbral" type="checkbox">
                                        <label for="umbral"><p>Umbral mayor igual que</p></label>
                                        <input id="umbral-value" type="number" min="1" max="10" step="0.1" value="1">
                                        <div class="chart-state-dot" id="threshold-state-dot-1"> </div>
                                    </span>
                                </div>

                                <canvas id="chart-ctx-${id}" ></canvas>
                            </div>
                </section>
            </span>

           

        </div>
    </div>
</div>

</body>
</html>
